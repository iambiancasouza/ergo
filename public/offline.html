<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121116">
<title>Sem conexão · Ergo</title>
<!-- Página guardada pelo service worker (public/sw.js) para quando não há
     internet. Tudo embutido, sem arquivos externos: precisa abrir offline. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #121116;
    color: #F3F1F8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  /* Os dois brilhos do fundo do app. */
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before { top: -120px; left: -100px; width: 340px; height: 340px; background: rgba(184,166,240,0.2); filter: blur(100px); }
  body::after { bottom: -120px; right: -120px; width: 380px; height: 380px; background: rgba(95,70,157,0.26); filter: blur(110px); }
  main {
    position: relative;
    max-width: 340px;
    padding: 32px 24px;
    border-radius: 28px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 20px 0 0; font-size: 22px; }
  p { margin: 8px 0 28px; font-size: 15px; line-height: 1.5; color: #C9C4D6; }
  button {
    min-height: 48px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #121116;
    background: #B8A6F0;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #B8A6F0; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="#B8A6F0"><circle cx="32" cy="16" r="8"/><circle cx="14" cy="46" r="8"/><circle cx="50" cy="46" r="8"/></g>
    </svg>
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
